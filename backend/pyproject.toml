[project]
name = "chatdb-backend"
version = "1.0.0"
description = "Production-ready agentic SQL assistant using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.10",
    "langchain-openai>=0.0.2",
    "langgraph>=0.0.20",
    "sqlalchemy>=2.0.23",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.3.7",
    "scikit-learn>=1.3.2",
    "numpy>=1.24.3",
    "sqlparse>=0.4.4",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["backend"]

[project.dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

