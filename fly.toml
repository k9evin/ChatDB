# fly.toml app configuration file generated for chatdb-backend on 2025-12-13T17:14:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatdb-backend'
primary_region = 'sjc'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  API_DEBUG = 'false'
  API_HOST = '0.0.0.0'
  API_PORT = '8000'
  CORS_ORIGINS = 'https://chatdb-frontend.vercel.app,http://localhost:3000'
  DATABASE_URL = 'sqlite:///./demo_database.db'
  EMBEDDING_MODEL = 'text-embedding-3-small'
  EMBEDDING_PROVIDER = 'openai'
  LANGCHAIN_PROJECT = 'ChatDB-Agent'
  LANGCHAIN_TRACING_V2 = 'false'
  MAX_CONTEXT_LENGTH = '128000'
  MAX_RETRIES = '3'
  OPENROUTER_BASE_URL = 'https://openrouter.ai/api/v1'
  TEMPERATURE = '0.0'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

