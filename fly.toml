# Fly.io 配置文件
app = "chatdb-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  OPENROUTER_MODEL = "openai/gpt-4o-mini"
  DATABASE_URL = "sqlite:///./demo_database.db"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "10s"
  method = "GET"
  path = "/docs"


