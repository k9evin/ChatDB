services:
  - type: web
    name: chatdb-backend
    env: python
    runtime: python-3.11.9
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: kwaipilot/kat-coder-pro:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: DATABASE_URL
        value: sqlite:///./demo_database.db
      - key: LANGCHAIN_TRACING_V2
        value: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: ChatDB-Agent
      - key: MAX_RETRIES
        value: 3
      - key: TEMPERATURE
        value: 0.0
      - key: MAX_CONTEXT_LENGTH
        value: 128000
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: API_DEBUG
        value: false
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /docs




